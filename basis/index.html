<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f4f0e7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="description" content="Basis — average price, profit and loss, position size, and compound growth.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Basis">
  <title>Basis — Trading calculators</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
  <script src="./js/version.js"></script>
  <script src="./js/boot-theme.js"></script>
</head>
<body>
  <div class="phone" id="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div>
          <div class="brand-name" id="brand-name">Basis</div>
          <div class="brand-lead" id="brand-lead">Trading calculators</div>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="share-open" aria-label="Share Basis">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v11"/>
            <path d="M8.5 6.5 12 3l3.5 3.5"/>
            <path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="settings-open" aria-label="Settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </button>
      </div>
    </header>
    <main class="main" id="main"></main>
    <nav class="nav" id="nav"></nav>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h2 id="sheet-title">Settings</h2>
          <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div id="settings-update" hidden></div>
        <div class="field">
          <label for="lang" id="lang-label">Language</label>
          <select id="lang">
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
          </select>
        </div>
        <div class="field">
          <label for="currency" id="currency-label">Currency</label>
          <select id="currency">
            <option value="NONE" id="currency-none">Number only</option>
            <option value="USD">USD · $</option>
            <option value="EUR">EUR · €</option>
            <option value="GBP">GBP · £</option>
            <option value="AED">AED · د.إ</option>
            <option value="SAR">SAR · ر.س</option>
            <option value="QAR">QAR · ر.ق</option>
            <option value="KWD">KWD · د.ك</option>
          </select>
        </div>
        <div class="field">
          <span class="group-label" id="theme-label">Appearance</span>
          <div class="segment">
            <button type="button" id="theme-light">Light</button>
            <button type="button" id="theme-dark">Dark</button>
          </div>
        </div>
        <button type="button" class="sheet-action" id="rate-app">
          <span class="sheet-action-title" id="rate-title">Rate the app</span>
          <span class="sheet-action-hint" id="rate-hint">Open the Play Store listing</span>
        </button>
        <button type="button" class="sheet-action" id="send-feedback">
          <span class="sheet-action-title" id="feedback-title">Suggestions &amp; contact</span>
          <span class="sheet-action-hint" id="feedback-hint">Send us an email</span>
        </button>
        <div class="sheet-foot">
          <a id="privacy-link" href="./privacy-policy.html">Privacy</a>
          <span class="num" id="version-label">Version 1.2</span>
        </div>
      </div>
    </div>
    <div class="sheet" id="save-sheet" hidden>
      <div class="sheet-card keep-sheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
        <div class="sheet-head">
          <h2 id="save-title">Save this calculation</h2>
          <button type="button" class="icon-btn" id="save-close" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <p class="keep-preview" id="save-preview"></p>
        <div class="field">
          <label for="save-name" id="save-name-label">Name</label>
          <input id="save-name" type="text" maxlength="40" autocomplete="off">
          <p class="hint" id="save-name-hint"></p>
        </div>
        <button type="button" class="keep-confirm" id="save-confirm">Save</button>
      </div>
    </div>
    <div class="sheet" id="library-sheet" hidden>
      <div class="sheet-card keep-sheet" role="dialog" aria-modal="true" aria-labelledby="library-title">
        <div class="sheet-head">
          <h2 id="library-title">Saved calculations</h2>
          <button type="button" class="icon-btn" id="library-close" aria-label="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div id="library-list" class="keep-shelf-list"></div>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
