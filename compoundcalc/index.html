  <script>
    (function () {
      var lang = (navigator.language || 'ar').toLowerCase();
      var arabic = lang.indexOf('ar') === 0;
      var title = arabic ? 'حاسبة الفائدة المركبة' : 'Compound Interest Calculator';
      var shortTitle = arabic ? 'حاسبة الاستثمار' : 'Compound Calc';
      document.documentElement.lang = arabic ? 'ar' : 'en';
      document.documentElement.dir = arabic ? 'rtl' : 'ltr';
      document.title = title;
      var apple = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (apple) apple.setAttribute('content', shortTitle);
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = arabic ? 'manifest.json' : 'manifest-en.json';
      document.head.appendChild(link);
    })();
  </script>

  <!--

  -->
  <script>
    (function () {
      function shouldTrackWebUsage() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('source') === 'play') return false;
        if (document.referrer && document.referrer.indexOf('play.google.com') !== -1) {
          return false;
        }
        return true;
      }

      window.initWebAnalytics = function () {
        if (!shouldTrackWebUsage()) return;
        // Cloudflare Web Analytics — same token as smartappsflow.net / smartloan
        var s = document.createElement('script');
        s.defer = true;
        s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        s.setAttribute('data-cf-beacon', '{"token": "215281d4f5024ae0bec2a82dea63a851"}');
        document.body.appendChild(s);
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.initWebAnalytics);
      } else {
        window.initWebAnalytics();
      }
    })();
  </script>

  <!--
    Installed copies keep the previous app in a service worker and the
    browser cache. This waits for app_build.txt, drops that copy when the
    published build changes, then starts Flutter.
  -->
  <script>
    (function () {
      var BUILD_FILE = 'app_build.txt';
      var STORAGE_KEY = 'compoundcalc_build';

      function startApp() {
        if (document.getElementById('flutter-bootstrap')) return;
        var script = document.createElement('script');
        script.id = 'flutter-bootstrap';
        script.async = true;
        script.src = 'flutter_bootstrap.js?v=20261021194454';
        document.body.appendChild(script);
      }

      function remember(buildId) {
        try { localStorage.setItem(STORAGE_KEY, buildId); } catch (e) {}
      }

      function readStored() {
        try { return localStorage.getItem(STORAGE_KEY) || ''; } catch (e) { return ''; }
      }

      function alreadyReloaded(buildId) {
        try { return sessionStorage.getItem('compoundcalc_reloaded') === buildId; }
        catch (e) { return false; }
      }

      function markReloaded(buildId) {
        try { sessionStorage.setItem('compoundcalc_reloaded', buildId); } catch (e) {}
      }

      function isCalculatorWorker(reg) {
        var script = '';
        if (reg.active) script = reg.active.scriptURL || '';
        else if (reg.installing) script = reg.installing.scriptURL || '';
        else if (reg.waiting) script = reg.waiting.scriptURL || '';
        return (reg.scope || '').indexOf('/compoundcalc/') !== -1 ||
          script.indexOf('flutter_service_worker.js') !== -1;
      }

      function isCalculatorCache(key) {
        return key.indexOf('flutter') !== -1 || key.indexOf('compoundcalc') !== -1;
      }

      function clearInstalledCopy() {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.filter(isCalculatorWorker).map(function (reg) {
              return reg.unregister();
            }));
          }));
        }
        if ('caches' in window) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.filter(isCalculatorCache).map(function (key) {
              return caches.delete(key);
            }));
          }));
        }
        ['index.html', 'flutter_bootstrap.js', 'main.dart.js', 'manifest.json', 'manifest-en.json'].forEach(function (file) {
          tasks.push(fetch(file, { cache: 'reload' }).catch(function () {}));
        });
        return Promise.all(tasks);
      }

      fetch(BUILD_FILE + '?ts=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.text() : ''; })
        .then(function (text) {
          var buildId = (text || '').trim();
          if (!buildId) {
            startApp();
            return;
          }
          var params = new URLSearchParams(window.location.search);
          if (params.get('v') === buildId || alreadyReloaded(buildId)) {
            remember(buildId);
            startApp();
            return;
          }
          var stored = readStored();
          var checks = [];
          if ('serviceWorker' in navigator) {
            checks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
              return regs.some(isCalculatorWorker);
            }));
          }
          if ('caches' in window) {
            checks.push(caches.keys().then(function (keys) {
              return keys.some(isCalculatorCache);
            }));
          }
          return Promise.all(checks).then(function (flags) {
            var installed = flags.some(Boolean);
            var publishedUpdate = stored !== '' && stored !== buildId;
            if (!installed && !publishedUpdate) {
              remember(buildId);
              startApp();
              return;
            }
            markReloaded(buildId);
            remember(buildId);
            return clearInstalledCopy().then(function () {
              var url = new URL(window.location.href);
              url.searchParams.set('v', buildId);
              window.location.replace(url.toString());
            });
          });
        })
        .catch(function () { startApp(); });
    })();
  </script>
</body>
