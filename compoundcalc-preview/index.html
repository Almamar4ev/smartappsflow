<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Review copy: keep it out of search results. -->
  <meta name="robots" content="noindex, nofollow">
  <base href="/compoundcalc-preview/">

  <meta charset="UTF-8">
  <!--
    Only this site's own files may run or load. Inline scripts are not
    allowed (they live in js/); 'wasm-unsafe-eval' is what the rendering
    engine (CanvasKit, bundled locally) needs; Cloudflare Web Analytics is
    the one outside script. Styles stay inline-able because the engine
    writes its own <style> tags.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Zoom stays allowed: the app runs inside #app-host, so the engine does
       not replace this tag with one that disables pinch-zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="حاسبة الفائدة المركبة — أداة تقديرية لتخطيط الاستثمار طويل الأجل.">
  <!-- The engine updates the tag with this id instead of adding a second one. -->
  <meta id="flutterweb-theme" name="theme-color" content="#0B5ED7">

  <!-- iOS / Safari PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="حاسبة الاستثمار">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>حاسبة الفائدة المركبة</title>

  <!-- Loading screen: shown until Flutter paints its first frame, so the
       page is never a blank white screen while the app downloads. -->
  <style>
    html, body { margin: 0; height: 100%; background: #E3EFFF; }
    /* The app draws here, filling the window. */
    #app-host { position: fixed; inset: 0; }
    #app-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: #E3EFFF;
      transition: opacity .25s ease;
    }
    #app-splash.hide { opacity: 0; pointer-events: none; }
    #app-splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(11,94,215,.18); }
    #app-splash .spin {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #C3D4F0; border-top-color: #0B5ED7;
      animation: app-spin .8s linear infinite;
    }
    @keyframes app-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body, #app-splash { background: #0D1420; }
      #app-splash img { box-shadow: none; }
      #app-splash .spin { border-color: #26354B; border-top-color: #5B9BFF; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .spin { animation-duration: 2.4s; }
    }
  </style>
  <script src="js/page-setup.js"></script>

  <!--
    Cloudflare Web Analytics — live site only. Counts page visits, not
    typed numbers, and not Play Store app users.
  -->
  <script src="js/analytics.js"></script>
</head>
<body>
  <div id="app-host"></div>
  <div id="app-splash" role="progressbar" aria-busy="true">
    <img src="icons/app-icon-192.png" alt="" width="96" height="96">
    <div class="spin"></div>
  </div>
  <script src="js/splash.js"></script>
  <script id="flutter-bootstrap" src="flutter_bootstrap.js?v=20261111040203" async></script>
  <script src="js/updates.js"></script>
</body>
</html>
