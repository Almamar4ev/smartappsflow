name: Build Edgeory AAB

on:
  # Trusted signing runs happen only on push to main (and manual dispatch).
  push:
    branches:
      - main
    paths:
      - 'tradelogpro/**'
      - '.github/workflows/build-tradelogpro.yml'
  # PR runs only test and build unsigned artifacts; they never touch secrets.
  pull_request:
    branches: [ main ]
    paths:
      - 'tradelogpro/**'
      - '.github/workflows/build-tradelogpro.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # All `run:` steps execute inside the tradelogpro/ project folder so that
    # npm, Capacitor, and Gradle operate on this app only. Steps that use
    # `uses:` (checkout, setup-*, signing, upload) ignore this and take paths
    # relative to the workspace root, so those are written as tradelogpro/... .
    defaults:
      run:
        working-directory: tradelogpro

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Install exactly the locked versions. `npm ci` fails if package.json
      # and package-lock.json disagree, so builds are fully reproducible.
      - name: Install dependencies (locked)
        run: npm ci

      # Gate the build on the financial engine. If any of the accounting
      # tests fail, the whole workflow stops here and no APK/AAB is produced.
      - name: Run financial tests
        run: npm test

      - name: Prepare web folder
        run: |
          mkdir -p www/css www/js
          cp index.html www/index.html
          cp css/app.css www/css/app.css
          cp js/*.js www/js/
          # PWA assets: manifest.json and sw.js are required and must exist.
          cp manifest.json www/manifest.json
          cp sw.js www/sw.js
          # Icons are optional for now: copy only if present so the build does
          # not fail before an Edgeory icon has been added.
          [ -f icon-192.png ] && cp icon-192.png www/icon-192.png || echo "icon-192.png not present yet — skipping"
          [ -f icon-512.png ] && cp icon-512.png www/icon-512.png || echo "icon-512.png not present yet — skipping"
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o www/xlsx.full.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/jspdf.umd.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js -o www/chart.umd.min.js
          mkdir -p www/fonts
          curl -fsSL https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@5.2.7/latin-400-normal.woff2 -o www/fonts/ibm-plex-mono-400.woff2
          curl -fsSL https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@5.2.7/latin-500-normal.woff2 -o www/fonts/ibm-plex-mono-500.woff2
          curl -fsSL https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@5.2.7/latin-600-normal.woff2 -o www/fonts/ibm-plex-mono-600.woff2
          curl -fsSL https://cdn.jsdelivr.net/fontsource/fonts/ibm-plex-mono@5.2.7/latin-700-normal.woff2 -o www/fonts/ibm-plex-mono-700.woff2
          curl -fsSL https://cdn.jsdelivr.net/fontsource/fonts/dm-sans@5.2.8/latin-400-normal.woff2 -o www/fonts/dm-sans-400.woff2
          curl -fsSL https://cdn.jsdelivr.net/fontsource/fonts/dm-sans@5.2.8/latin-500-normal.woff2 -o www/fonts/dm-sans-500.woff2
          curl -fsSL https://cdn.jsdelivr.net/fontsource/fonts/dm-sans@5.2.8/latin-600-normal.woff2 -o www/fonts/dm-sans-600.woff2
          curl -fsSL https://cdn.jsdelivr.net/fontsource/fonts/dm-sans@5.2.8/latin-700-normal.woff2 -o www/fonts/dm-sans-700.woff2

      # Force a single JSON Capacitor config (same pattern as Smart Loan).
      # Play Console app is registered as com.tradelog.pro — any mismatch
      # rejects the AAB with "needs to have the package name com.tradelog.pro".
      - name: Init Capacitor
        run: |
          npx cap init "Edgeory" "com.tradelog.pro" --web-dir www || true
          rm -f capacitor.config.ts capacitor.config.js
          cat > capacitor.config.json <<'CFGEOF'
          {
            "appId": "com.tradelog.pro",
            "appName": "Edgeory",
            "webDir": "www",
            "android": {
              "backgroundColor": "#0c0f1a"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "launchAutoHide": true,
                "backgroundColor": "#0c0f1a",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          CFGEOF

      - name: Add Android platform
        run: npx cap add android

      # Capacitor 6's default AGP cannot compile against android-36.
      # Same bump as Smart Loan: AGP 8.7.2 + Gradle 8.9.
      - name: Upgrade Android Gradle Plugin + Gradle for compileSdk 36
        run: |
          set -e
          sed -i "s#com.android.tools.build:gradle:[0-9.]*#com.android.tools.build:gradle:8.7.2#" android/build.gradle
          sed -i "s#gradle-[0-9.]*-\(all\|bin\).zip#gradle-8.9-\1.zip#" android/gradle/wrapper/gradle-wrapper.properties
          echo "AGP:";    grep "com.android.tools.build:gradle" android/build.gradle
          echo "Gradle:"; grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Update SDK, version, and lock package name
        run: |
          set -e
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' android/variables.gradle
          # Play Console (as of 2026) requires targetSdk >= 36 for new releases.
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' android/variables.gradle
          # versionCode only has to be unique and increasing, so it tracks the
          # CI run number. versionName is the version users and Play Console
          # reports show, so it comes from package.json: bump it there once and
          # every build of that release carries the same name.
          APP_VERSION="$(node -p "require('./package.json').version")"
          sed -i "s/versionCode .*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"${APP_VERSION}\"/" android/app/build.gradle
          # Capacitor usually sets these from appId; pin them explicitly so a
          # wrong scaffold never reaches Play Console.
          sed -i 's/applicationId .*/applicationId "com.tradelog.pro"/' android/app/build.gradle
          sed -i 's/namespace .*/namespace "com.tradelog.pro"/' android/app/build.gradle
          echo "=== SDK / applicationId / namespace ==="
          grep -E 'minSdkVersion|compileSdkVersion|targetSdkVersion' android/variables.gradle
          grep -E 'applicationId|namespace' android/app/build.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'applicationId "com.tradelog.pro"' android/app/build.gradle
          grep -q 'namespace "com.tradelog.pro"' android/app/build.gradle
          grep -q "versionName \"${APP_VERSION}\"" android/app/build.gradle

      # Without this the AAB ships Capacitor's placeholder launcher icon and
      # splash. icon-512.png is a full-bleed rounded square drawn on opaque
      # black, so the black outside the rounded edge is masked away first; the
      # flat blue behind it matches the artwork edge so the system mask shows
      # no seam.
      - name: Generate Android launcher icons and splash from icon-512.png
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y imagemagick
          SRC=icon-512.png
          RES=android/app/src/main/res
          BG='#045DF1'
          test -f "$SRC"
          # Cut the black outside the artwork with a mask matching its own
          # corner radius (~100/512). Drawn at 4x and scaled down so the curve
          # stays anti-aliased. A colour-keyed removal is not usable here: the
          # binder rings inside the artwork are pure black too.
          convert -size 2048x2048 xc:black -fill white \
            -draw 'roundrectangle 0,0 2047,2047 400,400' \
            -resize 512x512 mask.png
          convert "$SRC" -resize 512x512! mask.png \
            -alpha off -compose CopyOpacity -composite logo.png
          identify logo.png
          # density: legacy ic_launcher size, adaptive layer size (108dp)
          for entry in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $entry
            dir="$RES/mipmap-$1"
            mkdir -p "$dir"
            # Legacy icons (API <= 25) are flattened onto the brand blue.
            convert logo.png -resize "${2}x${2}" -background "$BG" -flatten "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            # Only the middle 72dp of an adaptive layer is ever shown, so the
            # artwork is scaled to that viewport and padded out to 108dp.
            fg=$(( $3 * 2 / 3 ))
            convert logo.png -resize "${fg}x${fg}" \
              -background none -gravity center -extent "${3}x${3}" \
              "$dir/ic_launcher_foreground.png"
            # Capacitor's placeholder background layer is unused once the
            # adaptive icon points at @color/ic_launcher_background.
            rm -f "$dir/ic_launcher_background.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XMLEOF
          done
          # Drop any template-supplied definition first; two colors with the
          # same name in values/ would fail the resource merge.
          for f in "$RES"/values*/*.xml; do
            [ -f "$f" ] || continue
            case "$f" in */ic_launcher_background.xml) continue;; esac
            sed -i '/name="ic_launcher_background"/d' "$f"
          done
          cat > "$RES/values/ic_launcher_background.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#045DF1</color>
          </resources>
          XMLEOF
          # Splash used before Android 12 (the launch theme's windowBackground,
          # held by @capacitor/splash-screen). CENTER_CROP in capacitor.config
          # keeps the logo undistorted on every aspect ratio.
          mkdir -p "$RES/drawable"
          convert -size 2732x2732 xc:'#0c0f1a' \
            \( logo.png -resize 760x760 \) -gravity center -composite \
            "$RES/drawable/splash.png"
          # Overwrite the density-specific defaults the template ships too.
          find "$RES" -name 'splash.png' -not -path "$RES/drawable/splash.png" -exec cp "$RES/drawable/splash.png" {} \;
          # Android 12+ draws its own system splash from the launch theme: flat
          # background plus a 1152px canvas whose icon sits in the safe 540px.
          mkdir -p "$RES/values-v31"
          cat > "$RES/values-v31/styles.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#0c0f1a</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
              </style>
          </resources>
          XMLEOF
          convert logo.png -resize 540x540 -background none -gravity center -extent 1152x1152 "$RES/drawable/splash_icon.png"
          rm -f logo.png mask.png
          echo "=== generated launcher icons and splash ==="
          identify "$RES/mipmap-xxxhdpi/ic_launcher.png" "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          identify "$RES/drawable/splash.png" "$RES/drawable/splash_icon.png"
          grep -q 'ic_launcher_background' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q 'windowSplashScreenAnimatedIcon' "$RES/values-v31/styles.xml"

      - name: Copy web assets
        run: npx cap sync android

      - name: Build AAB and APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease
          echo "=== package from merged manifest ==="
          grep -o 'package="[^"]*"' app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml \
            || grep -o 'package="[^"]*"' app/build/intermediates/merged_manifest/release/AndroidManifest.xml \
            || true

      # -------------------------------------------------------------------
      # Signing section. Runs ONLY on trusted events (push / workflow_dispatch),
      # never on pull_request: PR runs validate tests and the unsigned build
      # without ever reading signing secrets.
      # -------------------------------------------------------------------
      - name: Skip signing on pull_request
        if: github.event_name == 'pull_request'
        run: echo "Signing skipped for pull_request; trusted push run will sign artifacts."

      # Decode the base64 signing key into a temporary keystore outside the
      # workspace ($RUNNER_TEMP is a per-job scratch dir, not checked out and
      # not uploaded). A hard empty-check fails fast with a clear message if the
      # SIGNING_KEY secret is unbound or blank. tr strips any CR/LF/spaces that
      # break DER length parsing, then base64 --decode writes the raw bytes.
      # The keystore path is exported via GITHUB_ENV for the later steps.
      # NOTE: Edgeory uses its OWN dedicated Actions secrets
      # (TRADELOG_KEYSTORE_BASE64 / TRADELOG_KEYSTORE_PASSWORD /
      # TRADELOG_KEY_ALIAS / TRADELOG_KEY_PASSWORD), separate from Smart Loan's
      # shared KEYSTORE_* / KEY_* secrets, so the two apps never collide.
      - name: Decode signing keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TRADELOG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::SIGNING_KEY repository secret is unavailable or empty"
            exit 1
          fi

          KEYSTORE_DIR="$RUNNER_TEMP/tradelog-signing"
          KEYSTORE_PATH="$KEYSTORE_DIR/signing.keystore"

          mkdir -p "$KEYSTORE_DIR"

          printf '%s' "$SIGNING_KEY" \
            | tr -d '\r\n ' \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is missing or empty"
            exit 1
          fi

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Decoded keystore size: $(stat -c%s "$KEYSTORE_PATH") bytes"

      # Prove the keystore, store password and alias all agree, using the
      # JDK 17 already set up above. No -v, so no certificate details leak.
      - name: Verify keystore, password and alias
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.TRADELOG_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.TRADELOG_KEYSTORE_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEY_STORE_PASSWORD \
            -alias "$KEY_ALIAS"

      # Sign the App Bundle with jarsigner (the standard tool for AAB upload
      # signing) and verify the signature.
      - name: Sign and verify AAB (jarsigner)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.TRADELOG_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.TRADELOG_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TRADELOG_KEY_PASSWORD }}
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEY_STORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            "$AAB" \
            "$KEY_ALIAS"
          jarsigner -verify "$AAB"

      # Sign the APK with the official Android SDK tools: zipalign then
      # apksigner. The newest installed build-tools version is auto-detected.
      - name: Sign and verify APK (zipalign + apksigner)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.TRADELOG_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.TRADELOG_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TRADELOG_KEY_PASSWORD }}
        run: |
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="android/app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/app-release-signed.apk"
          BT_DIR="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          BT_DIR="${BT_DIR%/}"
          echo "Using build-tools: $(basename "$BT_DIR")"
          "$BT_DIR/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BT_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"
          "$BT_DIR/apksigner" verify "$SIGNED"

      - name: Upload AAB
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Edgeory-release
          path: tradelogpro/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Edgeory-apk
          path: tradelogpro/android/app/build/outputs/apk/release/app-release-signed.apk
