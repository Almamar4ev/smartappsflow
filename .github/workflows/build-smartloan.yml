name: Build Smart Loan AAB

on:
  # Trusted signing runs happen only on push to main (and manual dispatch).
  push:
    branches:
      - main
    paths:
      - 'smartloan/**'
      - '.github/workflows/build-smartloan.yml'
  # PR runs only test + an unsigned compile check; they never touch secrets.
  pull_request:
    branches: [ main ]
    paths:
      - 'smartloan/**'
      - '.github/workflows/build-smartloan.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The build targets compileSdkVersion 35, so the android-35 platform and
      # its build-tools must be present in the SAME SDK root Gradle reads
      # (/usr/local/lib/android/sdk). sdkmanager installs relative to its own
      # location by default, which can land in a different root — so we force
      # the target with --sdk_root and then hard-verify android.jar exists.
      - name: Install Android SDK platform 35
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Target SDK root: $SDK_ROOT"
          SDKMGR=""
          for c in "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
                   "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
                   "$(command -v sdkmanager || true)"; do
            if [ -x "$c" ]; then SDKMGR="$c"; break; fi
          done
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "Platforms present:"; ls -1 "$SDK_ROOT/platforms" || true
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
            echo "::error::android-35/android.jar missing after install at $SDK_ROOT"
            exit 1
          fi
          echo "OK: $SDK_ROOT/platforms/android-35/android.jar present"

      # Gate the build on the loan-math + PWA tests. These import only Node
      # built-ins, so no npm install is needed. If any test fails the whole
      # workflow stops here and no APK/AAB is produced.
      - name: Run loan-math and PWA tests
        working-directory: smartloan
        run: npm test

      # Pin every Capacitor package to the v6 line (matching smartloan/package.json).
      # Leaving @capacitor/core / @capacitor/android unpinned pulls Capacitor 7,
      # which conflicts with the ^6 plugins and fails npm's peer resolution (ERESOLVE).
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli@6.2.1
          npm install @capacitor/core@6.2.1 @capacitor/android@6.2.1 @capacitor/splash-screen@6.0.3 @capacitor/filesystem@6.0.4 @capacitor/share@6.0.4 @capacitor/status-bar@6.0.3
          npm install -D @capacitor/assets@3.0.5

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp smartloan/index.html www/index.html

      - name: Init Capacitor
        run: |
          npx cap init "Smart Loan Calculator" "com.smartapps.smartloanadvisor" --web-dir www
          # `cap init` may scaffold a TypeScript config (capacitor.config.ts).
          # Loading it needs the `typescript` package, which isn't installed, so
          # `cap add android` crashes with "Cannot read properties of undefined
          # (reading 'CommonJS')". We supply our own JSON config below, so remove
          # any generated .ts and keep the JSON as the single source of truth.
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'CFGEOF'
          {
            "appId": "com.smartapps.smartloanadvisor",
            "appName": "Smart Loan Calculator",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "launchAutoHide": true,
                "backgroundColor": "#221B3E",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          CFGEOF

      - name: Add Android platform
        run: npx cap add android

      # The AGP that Capacitor 6 scaffolds is only tested up to compileSdk 33,
      # so it cannot load the android-35 framework and the build fails with
      # "failed to load include path .../android-35/android.jar". Bump the
      # Android Gradle Plugin and the Gradle wrapper to versions that support
      # compileSdk 35 (AGP 8.6.0 needs Gradle 8.7+, JDK 17 — already set up).
      - name: Upgrade Android Gradle Plugin + Gradle for compileSdk 35
        run: |
          set -e
          sed -i "s#com.android.tools.build:gradle:[0-9.]*#com.android.tools.build:gradle:8.6.0#" android/build.gradle
          sed -i "s#gradle-[0-9.]*-\(all\|bin\).zip#gradle-8.7-\1.zip#" android/gradle/wrapper/gradle-wrapper.properties
          echo "AGP:";    grep "com.android.tools.build:gradle" android/build.gradle
          echo "Gradle:"; grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Install ImageMagick (provides 'convert')
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Set Android 12+ system splash (dark bg + sharp dedicated icon)
        run: |
          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#221B3E</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
              </style>
          </resources>
          XMLEOF
          mkdir -p android/app/src/main/res/drawable
          convert smartloan/assets/icon-only.png -resize 540x540 -background none -gravity center -extent 1152x1152 android/app/src/main/res/drawable/splash_icon.png
          identify android/app/src/main/res/drawable/splash_icon.png
          echo "Android 12+ splash configured with dedicated hi-res icon"

      - name: Generate app icons and splash screens
        run: |
          mkdir -p assets
          cp smartloan/assets/icon-foreground.png assets/icon-foreground.png
          cp smartloan/assets/icon-background.png assets/icon-background.png
          cp smartloan/assets/icon-only.png assets/icon-only.png
          cp smartloan/assets/splash-source.png assets/splash.png
          cp smartloan/assets/splash-source.png assets/splash-dark.png
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#221B3E' \
            --iconBackgroundColorDark '#221B3E' \
            --splashBackgroundColor '#221B3E' \
            --splashBackgroundColorDark '#221B3E'

      - name: Update target SDK and version code
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
          sed -i 's/versionCode .*/versionCode 31/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "3.1"/' android/app/build.gradle

      # On Android 15 / targetSdk 35 the app is forced edge-to-edge, and inside
      # the WebView env(safe-area-inset-*) always resolves to 0 — so content
      # slid under the status bar (clock/battery) and the navigation buttons.
      # Fix: pad the Android content root with the REAL system-bar, cutout, and
      # visible-IME insets. CSS safe-area values stay browser-only, preventing
      # double padding. A narrow JS bridge also themes both bar regions/icons.
      - name: Set MainActivity that natively pads the WebView by system insets
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
          cat > "$MAIN_ACTIVITY" <<'JAVAEOF'
          package com.smartapps.smartloanadvisor;

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private View content;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  // Register before super so the bridge exists on the very first page load.
                  registerPlugin(SystemBarsPlugin.class);
                  super.onCreate(savedInstanceState);

                  // Use one edge-to-edge model on Android 15 and earlier. The root's native
                  // padding is the only native safe area; index.html sets its CSS safe-area
                  // variables to zero only in this Android shell, so padding cannot double.
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  content = findViewById(android.R.id.content);

                  // Transparent bars reveal the root background. Disable Android's contrast
                  // scrims so the requested theme colour is not silently altered.
                  getWindow().setStatusBarColor(Color.TRANSPARENT);
                  getWindow().setNavigationBarColor(Color.TRANSPARENT);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      getWindow().setStatusBarContrastEnforced(false);
                      getWindow().setNavigationBarContrastEnforced(false);
                  }

                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                      Insets bars = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                          | WindowInsetsCompat.Type.displayCutout());

                      // With edge-to-edge, IME may arrive as an inset rather than resize the
                      // window. Use max(), never addition: IME and navigation bar overlap.
                      Insets safe = bars;
                      if (insets.isVisible(WindowInsetsCompat.Type.ime())) {
                          Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                          safe = Insets.of(
                              Math.max(bars.left, ime.left),
                              Math.max(bars.top, ime.top),
                              Math.max(bars.right, ime.right),
                              Math.max(bars.bottom, ime.bottom));
                      }
                      v.setPadding(safe.left, safe.top, safe.right, safe.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });

                  applySystemBarsTheme(Color.parseColor("#F1F5F9"), true);
                  ViewCompat.requestApplyInsets(content);
              }

              private void applySystemBarsTheme(final int color, final boolean darkIcons) {
                  runOnUiThread(() -> {
                      content.setBackgroundColor(color);
                      WindowInsetsControllerCompat controller =
                          WindowCompat.getInsetsController(getWindow(), content);
                      controller.setAppearanceLightStatusBars(darkIcons);
                      controller.setAppearanceLightNavigationBars(darkIcons);
                  });
              }
          }
          JAVAEOF

          JAVA_DIR=$(dirname "$MAIN_ACTIVITY")
          cat > "$JAVA_DIR/SystemBarsPlugin.java" <<'JAVAEOF'
          package com.smartapps.smartloanadvisor;

          import android.graphics.Color;
          import android.view.View;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "SmartLoanSystemBars")
          public class SystemBarsPlugin extends Plugin {
              @PluginMethod
              public void setTheme(PluginCall call) {
                  String colorValue = call.getString("color");
                  Boolean darkIconsValue = call.getBoolean("darkIcons");
                  if (colorValue == null
                      || !colorValue.matches("^#[0-9A-Fa-f]{6}$")
                      || darkIconsValue == null) {
                      call.reject("A valid #RRGGBB color and darkIcons are required");
                      return;
                  }

                  final int color;
                  try {
                      color = Color.parseColor(colorValue);
                  } catch (IllegalArgumentException error) {
                      call.reject("Invalid system-bar color");
                      return;
                  }
                  final boolean darkIcons = darkIconsValue;

                  getActivity().runOnUiThread(() -> {
                      View content = getActivity().findViewById(android.R.id.content);
                      content.setBackgroundColor(color);
                      WindowInsetsControllerCompat controller =
                          WindowCompat.getInsetsController(getActivity().getWindow(), content);
                      controller.setAppearanceLightStatusBars(darkIcons);
                      controller.setAppearanceLightNavigationBars(darkIcons);
                      call.resolve();
                  });
              }
          }
          JAVAEOF
          echo "MainActivity.java applies native safe areas, IME handling, and themed system bars"

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # The Gradle wrapper downloads the Gradle distribution on first use, which
      # occasionally fails mid-stream on hosted runners (transient SSL/network
      # read). Warm it up with retries so a flaky download doesn't fail the
      # whole build; once fetched it is cached for the later build steps.
      - name: Warm up Gradle wrapper (retry flaky distribution download)
        run: |
          cd android
          for i in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            echo "Gradle bootstrap attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "::error::Gradle wrapper failed to download after 3 attempts"
          exit 1

      # -------------------------------------------------------------------
      # PR compile check (no secrets). Validates the Android project builds
      # before anything is signed. Runs only on pull_request.
      # -------------------------------------------------------------------
      - name: Unsigned compile check (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # -------------------------------------------------------------------
      # Signing section. Runs ONLY on trusted events (push / workflow_dispatch),
      # never on pull_request, so PRs never read Smart Loan's signing secrets.
      # Smart Loan uses its OWN secrets: KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
      # KEY_ALIAS / KEY_PASSWORD (never shared with another app).
      # -------------------------------------------------------------------
      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/smartloan.keystore

      - name: Print SHA-256 fingerprint
        if: github.event_name != 'pull_request'
        run: keytool -list -v -keystore android/app/smartloan.keystore -alias ${{ secrets.KEY_ALIAS }} -storepass ${{ secrets.KEYSTORE_PASSWORD }} | grep SHA256

      - name: Build Release AAB
        if: github.event_name != 'pull_request'
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/smartloan.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Build Debug APK for testing
        if: github.event_name != 'pull_request'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SmartLoanCalculator-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Debug APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SmartLoanCalculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
