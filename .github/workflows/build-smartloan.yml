name: Build Smart Loan AAB

on:
  # Trusted signing runs happen only on push to main (and manual dispatch).
  push:
    branches:
      - main
    paths:
      - 'smartloan/**'
      - '.github/workflows/build-smartloan.yml'
  # PR runs only test + an unsigned compile check; they never touch secrets.
  pull_request:
    branches: [ main ]
    paths:
      - 'smartloan/**'
      - '.github/workflows/build-smartloan.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gate the build on the loan-math + PWA tests. These import only Node
      # built-ins, so no npm install is needed. If any test fails the whole
      # workflow stops here and no APK/AAB is produced.
      - name: Run loan-math and PWA tests
        working-directory: smartloan
        run: npm test

      # Pin every Capacitor package to the v6 line (matching smartloan/package.json).
      # Leaving @capacitor/core / @capacitor/android unpinned pulls Capacitor 7,
      # which conflicts with the ^6 plugins and fails npm's peer resolution (ERESOLVE).
      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli@6.2.1
          npm install @capacitor/core@6.2.1 @capacitor/android@6.2.1 @capacitor/splash-screen@6.0.3 @capacitor/filesystem@6.0.4 @capacitor/share@6.0.4 @capacitor/status-bar@6.0.3
          npm install -D @capacitor/assets@3.0.5

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp smartloan/index.html www/index.html

      - name: Init Capacitor
        run: |
          npx cap init "Smart Loan Calculator" "com.smartapps.smartloanadvisor" --web-dir www
          cat > capacitor.config.json <<'CFGEOF'
          {
            "appId": "com.smartapps.smartloanadvisor",
            "appName": "Smart Loan Calculator",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "launchAutoHide": true,
                "backgroundColor": "#221B3E",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          CFGEOF

      - name: Add Android platform
        run: npx cap add android

      - name: Install ImageMagick (provides 'convert')
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Set Android 12+ system splash (dark bg + sharp dedicated icon)
        run: |
          mkdir -p android/app/src/main/res/values-v31
          cat > android/app/src/main/res/values-v31/styles.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#221B3E</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
              </style>
          </resources>
          XMLEOF
          mkdir -p android/app/src/main/res/drawable
          convert smartloan/assets/icon-only.png -resize 540x540 -background none -gravity center -extent 1152x1152 android/app/src/main/res/drawable/splash_icon.png
          identify android/app/src/main/res/drawable/splash_icon.png
          echo "Android 12+ splash configured with dedicated hi-res icon"

      - name: Generate app icons and splash screens
        run: |
          mkdir -p assets
          cp smartloan/assets/icon-foreground.png assets/icon-foreground.png
          cp smartloan/assets/icon-background.png assets/icon-background.png
          cp smartloan/assets/icon-only.png assets/icon-only.png
          cp smartloan/assets/splash-source.png assets/splash.png
          cp smartloan/assets/splash-source.png assets/splash-dark.png
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#221B3E' \
            --iconBackgroundColorDark '#221B3E' \
            --splashBackgroundColor '#221B3E' \
            --splashBackgroundColorDark '#221B3E'

      - name: Update target SDK and version code
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' android/variables.gradle
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
          sed -i 's/versionCode .*/versionCode 30/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "3.0"/' android/app/build.gradle

      - name: Set plain MainActivity (system-insets handled by Android + StatusBar plugin)
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java")
          cat > "$MAIN_ACTIVITY" <<'JAVAEOF'
          package com.smartapps.smartloanadvisor;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
          }
          JAVAEOF
          echo "MainActivity.java set to default (no edge-to-edge; content sits below status/nav bars)"

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # -------------------------------------------------------------------
      # PR compile check (no secrets). Validates the Android project builds
      # before anything is signed. Runs only on pull_request.
      # -------------------------------------------------------------------
      - name: Unsigned compile check (pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # -------------------------------------------------------------------
      # Signing section. Runs ONLY on trusted events (push / workflow_dispatch),
      # never on pull_request, so PRs never read Smart Loan's signing secrets.
      # Smart Loan uses its OWN secrets: KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
      # KEY_ALIAS / KEY_PASSWORD (never shared with another app).
      # -------------------------------------------------------------------
      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/smartloan.keystore

      - name: Print SHA-256 fingerprint
        if: github.event_name != 'pull_request'
        run: keytool -list -v -keystore android/app/smartloan.keystore -alias ${{ secrets.KEY_ALIAS }} -storepass ${{ secrets.KEYSTORE_PASSWORD }} | grep SHA256

      - name: Build Release AAB
        if: github.event_name != 'pull_request'
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/smartloan.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Build Debug APK for testing
        if: github.event_name != 'pull_request'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload AAB artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SmartLoanCalculator-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Debug APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SmartLoanCalculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
